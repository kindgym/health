<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>센터 기구 도감</title>
<meta name="description" content="센터 보유 기구를 종류별로 모아 세팅·동작 순서·코칭 큐·주의사항과 영상을 확인하는 가이드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<!-- ARTIFACT:BEGIN -->
<style>
/* Layout: 고정 카테고리 레일 + 조밀한 기구 카드 그리드, 상세는 시트로 열림.
   카테고리 색은 경기용 원판 색(25kg 빨강 / 20kg 파랑 / 15kg 노랑 / 10kg 초록)에서 가져옴. */
:root{
  --bg:#E9ECF0; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E3E8EE;
  --ink:#12161B; --ink-2:#4C5663; --ink-3:#737F8D;
  --line:#D3DAE3; --line-2:#C2CBD6;
  --accent:#17509B; --accent-soft:#E4ECF7; --on-accent:#FFFFFF;
  --warn:#AE4327; --warn-soft:#F8E8E3;
  --c-cardio:#2E8B4F; --c-free:#BE3A28; --c-upper:#1A5FB4; --c-lower:#A8780D; --c-cable:#66717F;
  --shadow:0 1px 2px rgba(16,24,34,.05), 0 10px 26px rgba(16,24,34,.07);
  --radius:14px;
  --ff-display:'Black Han Sans','IBM Plex Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --ff-body:'IBM Plex Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  --ff-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1216; --surface:#161B21; --surface-2:#1D242B; --surface-3:#262E37;
    --ink:#E7ECF2; --ink-2:#9FACBA; --ink-3:#7B8794;
    --line:#29313A; --line-2:#36404B;
    --accent:#72A5EA; --accent-soft:#17283E; --on-accent:#0E1216;
    --warn:#E68A70; --warn-soft:#331F19;
    --c-cardio:#54C07D; --c-free:#E8705E; --c-upper:#72A5EA; --c-lower:#DFB24C; --c-cable:#97A3B1;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#161B21; --surface-2:#1D242B; --surface-3:#262E37;
  --ink:#E7ECF2; --ink-2:#9FACBA; --ink-3:#7B8794;
  --line:#29313A; --line-2:#36404B;
  --accent:#72A5EA; --accent-soft:#17283E; --on-accent:#0E1216;
  --warn:#E68A70; --warn-soft:#331F19;
  --c-cardio:#54C07D; --c-free:#E8705E; --c-upper:#72A5EA; --c-lower:#DFB24C; --c-cable:#97A3B1;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ── 상단 ─────────────────────────────── */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;justify-content:space-between;padding-block:20px 18px}
.brand h1{font-family:var(--ff-display);font-weight:400;font-size:clamp(26px,5.5vw,38px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px;max-width:48ch}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;transition:background .14s,border-color .14s,transform .08s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:8px 10px}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}

/* ── 레일(검색 + 카테고리) ───────────────── */
.rail{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.rail-in{display:flex;gap:10px;align-items:center;padding-block:11px;flex-wrap:wrap}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:9px 12px 9px 34px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface-2);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:500;transition:border-color .14s,background .14s}
.chip:hover{background:var(--surface-3)}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:var(--surface);box-shadow:inset 0 0 0 1px var(--c,var(--ink))}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3));flex:none}
.chip .n{font-family:var(--ff-num);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── 그리드 ──────────────────────────── */
main{padding-block:22px 48px}
.count{font-size:12.5px;color:var(--ink-3);font-family:var(--ff-num);margin:0 0 12px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px;list-style:none;margin:0;padding:0}
.card{position:relative;display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));border-radius:var(--radius);padding:15px 15px 13px;box-shadow:var(--shadow);min-width:0}
.card-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--c,var(--ink-2))}
.vid-flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--ff-num);color:var(--ink-3)}
.vid-flag.on{color:var(--c-cardio)}
.card h3{font-family:var(--ff-display);font-weight:400;font-size:19px;line-height:1.25;margin:0;letter-spacing:-.01em}
.card .en{font-family:var(--ff-num);font-size:11px;color:var(--ink-3);letter-spacing:.02em;margin:-5px 0 0;text-transform:uppercase}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.8px;min-width:0}
.card dt{color:var(--ink-3);font-size:11.5px;font-weight:500;white-space:nowrap}
.card dd{margin:0;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.card dd.rx{font-family:var(--ff-num);font-variant-numeric:tabular-nums;font-size:12px}
.card .act{margin-top:auto;padding-top:4px;display:flex;gap:7px}
.card .act .btn{flex:1;justify-content:center}
.card-hide{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);border-radius:9px;padding:9px 11px;cursor:pointer;font-size:13px}
.card-hide:hover{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.card.is-custom::after{content:"직접 추가";position:absolute;top:-1px;right:-1px;font-family:var(--ff-num);font-size:10px;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:3px 7px;border-radius:0 var(--radius) 0 var(--radius)}
.add-card{display:flex;align-items:center;justify-content:center;gap:8px;min-height:150px;border:1.5px dashed var(--line-2);border-radius:var(--radius);background:transparent;color:var(--ink-2);cursor:pointer;font-size:14px;font-weight:500}
.add-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.empty{text-align:center;padding:56px 16px;color:var(--ink-3)}
.empty strong{display:block;font-family:var(--ff-display);font-weight:400;font-size:20px;color:var(--ink-2);margin-bottom:6px}

/* ── 상세 시트 ───────────────────────── */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,14,18,.5);backdrop-filter:blur(2px);border:0;padding:0;cursor:pointer}
.panel{position:relative;background:var(--surface);width:100%;max-width:700px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.3);animation:rise .22s ease-out}
@media (min-width:720px){.sheet{align-items:center}.panel{border-radius:18px;max-height:88vh;max-height:88dvh}}
@keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:flex-start}
.panel-head .cat-tag{margin-bottom:4px}
.panel-head h2{font-family:var(--ff-display);font-weight:400;font-size:clamp(21px,5vw,27px);margin:0;line-height:1.2;text-wrap:balance}
.panel-head .en{font-family:var(--ff-num);font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;margin:3px 0 0}
.close{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.close:hover{background:var(--surface-3);color:var(--ink)}
.panel-body>*{flex:0 0 auto}
.panel-body{overflow-y:auto;overscroll-behavior:contain;padding:18px max(18px,env(safe-area-inset-right,0px)) max(26px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact{background:var(--surface-2);padding:11px 13px;min-width:0}
.fact .k{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;margin-bottom:2px}
.fact .v{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.fact .v.num{font-family:var(--ff-num);font-variant-numeric:tabular-nums;font-size:13px}
section.blk h3{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:0 0 9px;display:flex;align-items:center;gap:8px}
section.blk h3::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start;font-size:14.5px;min-width:0}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--ff-num);font-size:11.5px;color:var(--on-accent);background:var(--accent);border-radius:6px;height:22px;display:grid;place-items:center;margin-top:2px}
.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.bul li{display:grid;grid-template-columns:16px 1fr;gap:9px;font-size:14px;min-width:0}
.bul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));margin-top:8px}
.bul.warn li::before{border-radius:2px;background:var(--warn)}
.bul.warn li{color:var(--warn)}
.blk.cautions{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 24%,transparent);border-radius:12px;padding:13px 15px}
.blk.cautions h3{color:var(--warn)}
.blk.cautions h3::after{background:color-mix(in srgb,var(--warn) 24%,transparent)}

/* ── 영상 ────────────────────────────── */
.vid-slot{border:1.5px dashed var(--line-2);border-radius:12px;background:var(--surface-2);padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.vid-slot .ph{width:46px;height:46px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3)}
.vid-slot p{margin:0;font-size:13px;color:var(--ink-3)}
.vid-slot .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vid-card{display:flex;align-items:center;gap:13px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:14px;text-decoration:none;color:inherit;transition:border-color .14s,background .14s}
.vid-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.vid-card .play{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.vid-card .t{font-weight:600;font-size:14.5px}
.vid-card .u{font-family:var(--ff-num);font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere;margin-top:1px}
.vid-edit{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

/* ── 폼 ──────────────────────────────── */
.form{display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px}
.form-act{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.note{font-size:12.5px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;line-height:1.55}

/* ── 토스트 / 푸터 ───────────────────── */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:90;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
footer{border-top:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:12.5px}
footer .wrap{padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1>센터 기구 도감</h1>
      <p>종류별로 모아 둔 보유 기구입니다. <strong>자세히 보기</strong>를 누르면 세팅·동작 순서·코칭 큐·주의사항과 영상이 나옵니다.</p>
    </div>
    <div class="tools">
      <button class="btn" id="themeBtn" type="button" title="밝게/어둡게">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>
        테마
      </button>
      <button class="btn" id="editBtn" type="button" aria-pressed="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        편집
      </button>
    </div>
  </div>
</header>

<nav class="rail" aria-label="기구 분류">
  <div class="wrap rail-in">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="기구 이름·부위로 검색 (예: 랫, 둔근)" aria-label="기구 검색" autocomplete="off">
    </div>
    <div class="chips" id="chips" role="group" aria-label="분류 선택"></div>
  </div>
</nav>

<main class="wrap">
  <p class="count" id="count"></p>
  <ul class="grid" id="grid"></ul>
  <div class="empty" id="empty" hidden>
    <strong>해당하는 기구가 없습니다</strong>
    검색어를 지우거나 다른 분류를 선택해 보세요.
  </div>
  <div id="editTools" class="form-act" style="justify-content:flex-start;margin-top:22px" hidden>
    <button class="btn" type="button" id="exportBtn">추가한 내용 내보내기</button>
    <button class="btn" type="button" id="resetBtn">내 변경사항 초기화</button>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="legend" id="legend"></div>
    <div>분류 색은 경기용 원판 색(25kg 빨강 · 20kg 파랑 · 15kg 노랑 · 10kg 초록)을 따랐습니다.</div>
  </div>
</footer>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <button class="scrim" id="scrim" type="button" aria-label="닫기"></button>
  <div class="panel">
    <div class="panel-head">
      <div style="min-width:0;flex:1">
        <div class="cat-tag" id="sheetCat"></div>
        <h2 id="sheetTitle"></h2>
        <p class="en" id="sheetEn"></p>
      </div>
      <button class="close" id="closeBtn" type="button" aria-label="닫기">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel-body" id="sheetBody"></div>
  </div>
</div>
<script>
const CATS=[
  {id:"cardio",name:"유산소",note:"심폐·체지방"},
  {id:"free",name:"프리웨이트",note:"바벨·덤벨·랙"},
  {id:"upper",name:"상체 머신",note:"가슴·등·어깨·팔"},
  {id:"lower",name:"하체 머신",note:"대퇴·둔근·종아리"},
  {id:"cable",name:"케이블·기능성",note:"케이블·코어·맨몸"}
];

const GEAR=[
/* ── 유산소 ───────────────────────────── */
{id:"treadmill",c:"cardio",n:"트레드밀",en:"Treadmill",t:"심폐지구력 · 하지 전반",rx:"20~40분 / 최대심박 60~75%",

<script>
(function(){
"use strict";
var LSKEY="gearguide.v1", THKEY="gearguide.theme";
var store={custom:[],video:{},hidden:[]};
try{var raw=localStorage.getItem(LSKEY);if(raw){var p=JSON.parse(raw);
  store.custom=Array.isArray(p.custom)?p.custom:[];
  store.video=(p.video&&typeof p.video==="object")?p.video:{};
  store.hidden=Array.isArray(p.hidden)?p.hidden:[];}}catch(e){}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(store));}catch(e){toast("이 브라우저에 저장할 수 없습니다");}}

var state={cat:"all",q:"",edit:false};
var lastFocus=null, resetArmed=false;
var $=function(s){return document.querySelector(s);};
var grid=$("#grid"), sheet=$("#sheet"), sheetBody=$("#sheetBody");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function catOf(id){for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i];}return{id:id,name:"기타",note:""};}
function cvar(id){return"var(--c-"+id+")";}
function list(){
  var out=GEAR.concat(store.custom);
  return out.filter(function(g){return store.hidden.indexOf(g.id)<0;});
}
function videoOf(g){return store.video[g.id]||g.v||"";}
function ytSearch(g){return"https://www.youtube.com/results?search_query="+encodeURIComponent(g.n+" 운동 방법 정자세");}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u;}}
function toast(msg){
  var old=document.querySelector(".toast");if(old)old.remove();
  var t=document.createElement("div");t.className="toast";t.textContent=msg;t.setAttribute("role","status");
  document.body.appendChild(t);setTimeout(function(){t.remove();},2600);
}

/* ── 레일 / 범례 ───────────────────────── */
function renderChips(){
  var items=list(), html="";
  html+='<button class="chip" type="button" data-cat="all" aria-pressed="'+(state.cat==="all")+'">전체 <span class="n">'+items.length+'</span></button>';
  CATS.forEach(function(c){
    var n=items.filter(function(g){return g.c===c.id;}).length;
    html+='<button class="chip" type="button" data-cat="'+c.id+'" style="--c:'+cvar(c.id)+'" aria-pressed="'+(state.cat===c.id)+'"><span class="dot"></span>'+esc(c.name)+' <span class="n">'+n+'</span></button>';
  });
  $("#chips").innerHTML=html;
  $("#legend").innerHTML=CATS.map(function(c){
    return '<span><i class="dot" style="--c:'+cvar(c.id)+'"></i>'+esc(c.name)+' · '+esc(c.note)+'</span>';
  }).join("");
}

/* ── 그리드 ───────────────────────────── */
function matches(g){
  if(state.cat!=="all"&&g.c!==state.cat)return false;
  var q=state.q.trim().toLowerCase();
  if(!q)return true;
  return (g.n+" "+g.en+" "+g.t+" "+catOf(g.c).name).toLowerCase().indexOf(q)>-1;
}
function cardHTML(g){
  var c=catOf(g.c), hasVid=!!videoOf(g);
  return '<li class="card'+(g.custom?" is-custom":"")+'" style="--c:'+cvar(g.c)+'">'+
    '<div class="card-top"><span class="cat-tag"><span class="dot"></span>'+esc(c.name)+'</span>'+
    '<span class="vid-flag'+(hasVid?" on":"")+'">'+(hasVid?"● 영상 있음":"○ 영상 자리")+'</span></div>'+
    '<h3>'+esc(g.n)+'</h3><p class="en">'+esc(g.en)+'</p>'+
    '<dl><dt>타깃</dt><dd>'+esc(g.t)+'</dd><dt>권장</dt><dd class="rx">'+esc(g.rx)+'</dd></dl>'+
    '<div class="act"><button class="btn btn-primary" type="button" data-open="'+esc(g.id)+'">자세히 보기</button>'+
    (state.edit?'<button class="card-hide" type="button" data-hide="'+esc(g.id)+'" title="목록에서 숨기기" aria-label="'+esc(g.n)+' 숨기기">✕</button>':"")+
    '</div></li>';
}
function render(){
  var items=list().filter(matches);
  grid.innerHTML=items.map(cardHTML).join("")+
    (state.edit?'<li><button class="add-card" type="button" id="addCard">＋ 기구 추가하기</button></li>':"");
  $("#empty").hidden=items.length>0||state.edit;
  var total=list().length;
  $("#count").textContent=items.length===total?(total+"종"):(items.length+"종 / 전체 "+total+"종");
  renderChips();
  var ht=$("#editTools");
  ht.hidden=!state.edit;
  var old=document.getElementById("restoreBtn");if(old)old.remove();
  if(state.edit&&store.hidden.length){
    var b=document.createElement("button");b.className="btn";b.type="button";b.id="restoreBtn";
    b.textContent="숨긴 기구 "+store.hidden.length+"개 되돌리기";
    b.addEventListener("click",function(){store.hidden=[];save();render();toast("숨긴 기구를 모두 되돌렸습니다");});
    ht.appendChild(b);
  }
}

/* ── 상세 시트 ───────────────────────── */
function blk(title,items,cls){
  if(!items||!items.length)return"";
  return '<section class="blk'+(cls?" "+cls:"")+'"><h3>'+esc(title)+'</h3><ul class="bul'+(cls==="cautions"?" warn":"")+'">'+
    items.map(function(x){return"<li>"+esc(x)+"</li>";}).join("")+"</ul></section>";
}
function videoHTML(g){
  var u=videoOf(g), inner;
  if(u){
    inner='<a class="vid-card" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+
      '<span class="play"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>'+
      '<span><span class="t">영상 보기</span><span class="u">'+esc(hostOf(u))+' · 새 탭에서 열림</span></span></a>';
  }else{
    inner='<div class="vid-slot"><span class="ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"/></svg></span>'+
      '<p>아직 등록된 영상이 없습니다.<br>트레이너가 촬영본을 올리면 여기에 연결됩니다.</p>'+
      '<span class="row"><a class="btn" href="'+esc(ytSearch(g))+'" target="_blank" rel="noopener noreferrer">유튜브에서 찾아보기</a></span></div>';
  }
  var editUI="";
  if(state.edit){
    editUI='<div class="vid-edit"><input type="url" id="vidInput" placeholder="https://youtu.be/..." value="'+esc(u)+'" aria-label="영상 링크" style="flex:1;min-width:180px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px">'+
      '<button class="btn btn-primary" type="button" data-savevid="'+esc(g.id)+'">저장</button>'+
      (u?'<button class="btn" type="button" data-clearvid="'+esc(g.id)+'">삭제</button>':"")+'</div>';
  }
  return '<section class="blk"><h3>영상</h3>'+inner+editUI+'</section>';
}
function openDetail(id){
  var g=null, all=list();
  for(var i=0;i<all.length;i++){if(all[i].id===id){g=all[i];break;}}
  if(!g)return false;
  var c=catOf(g.c);
  sheet.style.setProperty("--c",cvar(g.c));
  $("#sheetCat").innerHTML='<span class="dot" style="--c:'+cvar(g.c)+'"></span>'+esc(c.name);
  $("#sheetCat").style.color=cvar(g.c);
  $("#sheetTitle").textContent=g.n;
  $("#sheetEn").textContent=g.en;
  sheetBody.innerHTML=
    '<div class="facts"><div class="fact"><div class="k">타깃 근육</div><div class="v">'+esc(g.t)+'</div></div>'+
    '<div class="fact"><div class="k">권장 세트</div><div class="v num">'+esc(g.rx)+'</div></div></div>'+
    blk("세팅 체크",g.s)+
    (g.p&&g.p.length?'<section class="blk"><h3>동작 순서</h3><ol class="steps">'+g.p.map(function(x){return"<li>"+esc(x)+"</li>";}).join("")+"</ol></section>":"")+
    blk("코칭 큐",g.q)+
    blk("주의사항",g.w,"cautions")+
    videoHTML(g)+
    (state.edit&&g.custom?'<div class="form-act"><button class="btn" type="button" data-del="'+esc(g.id)+'" style="color:var(--warn);border-color:var(--warn)">이 기구 삭제</button></div>':"");
  showSheet();
  return true;
}
function showSheet(){
  if(sheet.hidden){lastFocus=document.activeElement;sheet.hidden=false;document.body.style.overflow="hidden";}
  $("#closeBtn").focus();
}
function hideSheet(){
  if(sheet.hidden)return;
  sheet.hidden=true;document.body.style.overflow="";
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function closeSheet(){
  if((location.hash||"").slice(1)!=="list"){location.hash="list";}else{hideSheet();}
}

/* ── 기구 추가 폼 ─────────────────────── */
function openAdd(){
  $("#sheetCat").innerHTML="";$("#sheetEn").textContent="";
  $("#sheetTitle").textContent="기구 추가";
  sheetBody.innerHTML=
    '<p class="note">센터에만 있는 기구를 추가합니다. 줄바꿈으로 여러 항목을 입력하세요. 입력 내용은 <strong>이 브라우저에만</strong> 저장됩니다 — 모든 회원에게 보이게 하려면 저장 후 <strong>내보내기</strong>로 전달해 주세요.</p>'+
    '<form class="form" id="addForm">'+
    '<div class="form-row">'+
    '<div class="field"><label for="f-n">기구 이름 *</label><input id="f-n" required maxlength="40" placeholder="예: 벨트 스쿼트"></div>'+
    '<div class="field"><label for="f-c">분류 *</label><select id="f-c">'+CATS.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+"</option>";}).join("")+"</select></div></div>"+
    '<div class="form-row">'+
    '<div class="field"><label for="f-en">영문 이름 <span class="hint">선택</span></label><input id="f-en" maxlength="50" placeholder="Belt Squat"></div>'+
    '<div class="field"><label for="f-t">타깃 근육 *</label><input id="f-t" required maxlength="50" placeholder="대퇴사두 · 둔근"></div></div>'+
    '<div class="field"><label for="f-rx">권장 세트 <span class="hint">선택</span></label><input id="f-rx" maxlength="40" placeholder="10~12회 × 3세트"></div>'+
    '<div class="field"><label for="f-s">세팅 체크 <span class="hint">한 줄에 하나</span></label><textarea id="f-s"></textarea></div>'+
    '<div class="field"><label for="f-p">동작 순서 <span class="hint">한 줄에 하나</span></label><textarea id="f-p"></textarea></div>'+
    '<div class="field"><label for="f-q">코칭 큐 <span class="hint">한 줄에 하나</span></label><textarea id="f-q"></textarea></div>'+
    '<div class="field"><label for="f-w">주의사항 <span class="hint">한 줄에 하나</span></label><textarea id="f-w"></textarea></div>'+
    '<div class="field"><label for="f-v">영상 링크 <span class="hint">선택</span></label><input id="f-v" type="url" placeholder="https://youtu.be/..."></div>'+
    '<div class="form-act"><button class="btn" type="button" id="cancelAdd">취소</button><button class="btn btn-primary" type="submit">추가하기</button></div>'+
    "</form>";
  showSheet();
  var f=$("#addForm");
  $("#cancelAdd").addEventListener("click",closeSheet);
  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    var lines=function(id){return $(id).value.split("\n").map(function(s){return s.trim();}).filter(Boolean);};
    var name=$("#f-n").value.trim();
    if(!name)return;
    var id="c"+Date.now().toString(36);
    store.custom.push({id:id,c:$("#f-c").value,n:name,en:$("#f-en").value.trim()||name,
      t:$("#f-t").value.trim()||"—",rx:$("#f-rx").value.trim()||"—",
      s:lines("#f-s"),p:lines("#f-p"),q:lines("#f-q"),w:lines("#f-w"),
      v:$("#f-v").value.trim(),custom:true});
    save();render();closeSheet();toast(name+" 추가됨");
  });
  $("#f-n").focus();
}

/* ── 내보내기 ─────────────────────────── */
function exportData(){
  var payload=JSON.stringify({custom:store.custom,video:store.video,hidden:store.hidden},null,2);
  $("#sheetCat").innerHTML="";$("#sheetEn").textContent="";
  $("#sheetTitle").textContent="내보내기";
  sheetBody.innerHTML='<p class="note">아래 내용을 복사해 트레이너에게 전달하면 모든 회원에게 보이도록 페이지에 반영할 수 있습니다.</p>'+
    '<div class="field"><textarea id="exp" readonly style="min-height:220px;font-family:var(--ff-num);font-size:12px"></textarea></div>'+
    '<div class="form-act"><button class="btn" type="button" id="copyExp">복사하기</button><button class="btn btn-primary" type="button" id="doneExp">닫기</button></div>';
  $("#exp").value=payload;
  showSheet();
  $("#doneExp").addEventListener("click",closeSheet);
  $("#copyExp").addEventListener("click",function(){
    var ta=$("#exp");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(payload).then(function(){toast("복사했습니다");},function(){ta.select();toast("직접 복사해 주세요");});
    }else{ta.select();toast("직접 복사해 주세요");}
  });
}

/* ── 이벤트 ───────────────────────────── */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-open],[data-hide],[data-savevid],[data-clearvid],[data-del],[data-cat],#addCard"):null;
  if(!t)return;
  if(t.id==="addCard"){openAdd();return;}
  if(t.hasAttribute("data-cat")){state.cat=t.getAttribute("data-cat");render();return;}
  if(t.hasAttribute("data-open")){var id=t.getAttribute("data-open");lastFocus=t;if((location.hash||"").slice(1)===id){openDetail(id);}else{location.hash=id;}return;}
  if(t.hasAttribute("data-hide")){
    var hid=t.getAttribute("data-hide");
    if(store.hidden.indexOf(hid)<0)store.hidden.push(hid);
    save();render();toast("목록에서 숨겼습니다");return;
  }
  if(t.hasAttribute("data-savevid")){
    var vid=t.getAttribute("data-savevid"), val=$("#vidInput").value.trim();
    if(val&&!/^https?:\/\//i.test(val)){toast("http로 시작하는 주소를 넣어 주세요");return;}
    if(val){store.video[vid]=val;}else{delete store.video[vid];}
    save();openDetail(vid);render();toast(val?"영상 링크를 저장했습니다":"영상 링크를 지웠습니다");return;
  }
  if(t.hasAttribute("data-clearvid")){
    var cid=t.getAttribute("data-clearvid");delete store.video[cid];
    var cg=store.custom.filter(function(x){return x.id===cid;})[0];if(cg)cg.v="";
    save();openDetail(cid);render();toast("영상 링크를 지웠습니다");return;
  }
  if(t.hasAttribute("data-del")){
    var did=t.getAttribute("data-del");
    store.custom=store.custom.filter(function(x){return x.id!==did;});
    delete store.video[did];save();render();closeSheet();toast("삭제했습니다");return;
  }
});
$("#scrim").addEventListener("click",closeSheet);
$("#closeBtn").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!sheet.hidden)closeSheet();});
$("#q").addEventListener("input",function(e){state.q=e.target.value;render();});
$("#editBtn").addEventListener("click",function(){
  state.edit=!state.edit;
  $("#editBtn").setAttribute("aria-pressed",String(state.edit));
  resetArmed=false;$("#resetBtn").textContent="내 변경사항 초기화";
  render();
  if(!sheet.hidden){var cur=(location.hash||"").slice(1);if(cur&&cur!=="list")openDetail(cur);}
  toast(state.edit?"편집 모드 — 기구 추가·영상 링크 등록이 가능합니다":"편집 모드를 껐습니다");
});
$("#exportBtn").addEventListener("click",exportData);
$("#resetBtn").addEventListener("click",function(){
  if(!resetArmed){resetArmed=true;this.textContent="한 번 더 누르면 초기화됩니다";setTimeout(function(){resetArmed=false;$("#resetBtn").textContent="내 변경사항 초기화";},4000);return;}
  store={custom:[],video:{},hidden:[]};save();resetArmed=false;this.textContent="내 변경사항 초기화";render();closeSheet();toast("초기화했습니다");
});
$("#themeBtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  if(!cur)cur=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  var next=cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem(THKEY,next);}catch(e){}
});
try{var th=localStorage.getItem(THKEY);if(th==="dark"||th==="light")document.documentElement.setAttribute("data-theme",th);}catch(e){}

function syncHash(){
  var id=(location.hash||"").slice(1);
  if(!id||id==="list"){hideSheet();return;}
  if(!openDetail(id))hideSheet();
}
window.addEventListener("hashchange",syncHash);
render();
syncHash();
})();
</script>
